
services:
  - type: web
    name: mcd-chatgpt-oauth-adapter
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: MCD_MCP_URL
        value: https://mcp.mcd.cn
      - key: MCD_MCP_TOKEN
        sync: false
      - key: ADAPTER_OWNER_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOW_ORDER_CREATION
        value: "false"
